[project]
name = "prezent-dla-siostry"
version = "0.1.0"
description = "Statyczna strona-zagadka z kuponem do escape roomu"
requires-python = ">=3.13"
dependencies = ["jinja2>=3.1", "cryptography>=43"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/present"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
# Globalny uv.toml wskazuje na firmowe repozytorium wymagające logowania.
# Ten projekt jest prywatny — paczki bierzemy z publicznego PyPI.
name = "pypi"
url = "https://pypi.org/simple"
default = true
