# Wszystko, co się zmienia przy podmianie na prawdziwy kupon, poza kupon.txt.
# Adres zmieniaj świadomie: trafia na kartkę jako hex, więc każda zmiana
# oznacza ponowny wydruk karty do druku.

[page]
# Bez "https://" i bez ukośnika na końcu. Kartka koduje CAŁY ten adres numerami liter.
# Musi mieć postać <user>.github.io/<repo>: stąd deploy bierze miejsce pushu.
url = "komarekzm.github.io/bhfm"
# Imię w wołaczu; trafia do leada przez {name}.
name = "Siostro"
title = "Koperta pierwsza"
# Przy true strona pokazuje pasek z ostrzeżeniem, że kupon jest zastępczy.
test_mode = true

[gift]
headline = "Godzina i kwadrans w Hogwarcie"
lead = "{name}, to nie jest zwykła kartka. Pod tym kodem czeka escape room: „Śladami Harry'ego” w Poznaniu, 75 minut w świecie magii. Ekipa od dwóch do czterech osób, termin ustalicie przy rezerwacji."
meta = ["Małe Garbary 2, Poznań", "75 minut", "2–4 osoby"]

[voucher]
note = "Pokaż ten kod przy rezerwacji albo wpisz go w polu „kod rabatowy” na lock.me."
redeem_url = "https://lock.me/pl/poland/wielkopolskie/poznan/escape-room/find-a-way-2/11574-sladami-harryego"
# Co strona mówi po poprawnym haśle. QR leży pod monitorem, nie tutaj.
location = "Słowo zna już całą drogę. Leży tam, gdzie kurz nie dochodzi — pod monitorem, razem z pieczęcią, po którą przyszłaś."

# ── Zagadka ───────────────────────────────────────────────────────────────────
# Jedno źródło prawdy: hasło to słowo złożone z liter na kwitach, ustawionych
# według CENY ZA JEDEN DRAM. Sortowanie po cenie łącznej daje inny ciąg — to pułapka.
# Build sprawdza, że wychodzi dokładnie `word` i że pułapka faktycznie działa.

# ── Zagadka ───────────────────────────────────────────────────────────────────
# Bez liczenia: opisy zaklęć bez nazw + bank zaklęć. Rozpoznajesz zaklęcie po skutku,
# bierzesz jego pierwszą literę; litery w kolejności notatek dają słowo.
# Build sprawdza, że wychodzi dokładnie `word` i że bank zaklęć nie zdradza hasła.

[puzzle]
word = "ALOHOMORA"
riddle = [
  "Zaklęcia zapisano bez nazw —",
  "zostały po nich tylko skutki.",
  "Rozpoznaj każde i weź pierwszą literę.",
  "Litery w kolejności notatek",
  "złożą słowo, które otwiera.",
]

[[puzzle.clues]]
spell = "Accio"
text = "Przywołuje przedmiot, którego nie chce Ci się szukać."

[[puzzle.clues]]
spell = "Lumos"
text = "Zapala światełko na końcu różdżki."

[[puzzle.clues]]
spell = "Oppugno"
text = "Każe przedmiotom rzucić się na tego, kogo wskazałaś."

[[puzzle.clues]]
spell = "Homenum Revelio"
text = "Mówi Ci, czy w pomieszczeniu ktoś się ukrywa."

[[puzzle.clues]]
spell = "Obliviate"
text = "Zabiera wspomnienie, którego ktoś wolałby nie mieć."

[[puzzle.clues]]
spell = "Muffliato"
text = "Wypełnia uszy pobliskich szumem, żeby nie usłyszeli rozmowy."

[[puzzle.clues]]
spell = "Orchideous"
text = "Wywołuje bukiet kwiatów, choć nie dotyka ziemi."

[[puzzle.clues]]
spell = "Reducto"
text = "Rozbija przeszkodę na kawałki."

[[puzzle.clues]]
spell = "Aguamenti"
text = "Z różdżki tryska strumień wody."

[card]
# Wskazówka na kartce — Twoje słowa, nie kod.
hint = "góra: domena · dół: kod"
