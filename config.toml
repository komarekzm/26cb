# Wszystko, co się zmienia przy podmianie na prawdziwy kupon, poza kupon.txt.
# Adres zmieniaj świadomie: trafia na kartkę jako hex, więc każda zmiana
# oznacza ponowny wydruk karty do druku.

[page]
# Bez "https://" i bez ukośnika na końcu — dokładnie to jest kodowane na kartce.
# Musi mieć postać <user>.github.io/<repo>: stąd deploy bierze miejsce pushu.
url = "komarekzm.github.io/p"
# Imię w wołaczu; trafia do leada przez {name}.
name = "Siostro"
title = "Koperta pierwsza"
# Przy true strona pokazuje pasek z ostrzeżeniem, że kupon jest zastępczy.
test_mode = true

[gift]
headline = "Godzina i kwadrans w Hogwarcie"
lead = "{name}, to nie jest zwykła kartka. Pod tym kodem czeka escape room: „Śladami Harry'ego” w Poznaniu, 75 minut w świecie magii. Ekipa od dwóch do czterech osób, termin ustalicie przy rezerwacji."
meta = ["Małe Garbary 2, Poznań", "75 minut", "2–4 osoby"]

[voucher]
note = "Pokaż ten kod przy rezerwacji albo wpisz go w polu „kod rabatowy” na lock.me."
redeem_url = "https://lock.me/pl/poland/wielkopolskie/poznan/escape-room/find-a-way-2/11574-sladami-harryego"
# Co strona mówi po poprawnym haśle. QR leży pod monitorem, nie tutaj.
location = "Dobrze. To słowo czeka na Ciebie pod monitorem — razem z tym, po co przyszłaś."

# ── Zagadka ───────────────────────────────────────────────────────────────────
# Jedno źródło prawdy: hasło to słowo złożone z liter na kwitach, ustawionych
# według CENY ZA JEDEN DRAM. Sortowanie po cenie łącznej daje inny ciąg — to pułapka.
# Build sprawdza, że wychodzi dokładnie `word` i że pułapka faktycznie działa.

[puzzle]
word = "ALOHOMORA"

